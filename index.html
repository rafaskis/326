        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

    <script>
        const GOOGLE_CLIENT_ID = '610766342355-plf8p3rbn5d74dt7g643s6ndq12nestd.apps.googleusercontent.com';
        const GOOGLE_DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
        const DEDICATED_FILE_NAME = 'overtime_database.json';

        const MONTH_NAMES = [
            "Ιανουάριος (January)", "Φεβρουάριος (February)", "Μάρτιος (March)", 
            "Απρίλιος (April)", "Μάιος (May)", "Ιούνιος (June)", 
            "Ιούλιος (July)", "Αύγουστος (August)", "Σεπτέμβριος (September)", 
            "Οκτώβριος (October)", "Νοέμβριος (November)", "Δεκέμβριος (December)"
        ];

        let records = [];
        let meta = { defaultMultiplier: "ΓΡΑΦΕΙΑΚΟ", lastUpdated: 0 };
        let activeYear = new Date().getFullYear();
        let editingRecordId = null;
        let collapsedMonths = {};

        let tokenClient = null;
        let activeAccessToken = null;
        let gdriveFileId = null;
        let isCloudSyncPending = false;

        function populateHourOptions() {
            const startHourSelect = document.getElementById('recStartHour');
            const endHourSelect = document.getElementById('recEndHour');
            startHourSelect.innerHTML = '';
            endHourSelect.innerHTML = '';

            for (let h = 0; h <= 24; h++) {
                const hourStr = h.toString().padStart(2, '0');
                startHourSelect.options.add(new Option(hourStr, hourStr));
                endHourSelect.options.add(new Option(hourStr, hourStr));
            }
        }

        function handleHourChange(prefix) {
            const hourVal = document.getElementById(`${prefix}Hour`).value;
            const minSelect = document.getElementById(`${prefix}Min`);

            if (hourVal === "24") {
                minSelect.value = "00";
                minSelect.disabled = true;
            } else {
                minSelect.disabled = false;
            }
        }

        function handleStartDateChange() {
            const startDateVal = document.getElementById('recStartDate').value;
            const endDateInput = document.getElementById('recEndDate');
            
            if (startDateVal) {
                endDateInput.disabled = false;
                if (!endDateInput.value || endDateInput.value < startDateVal) {
                    endDateInput.value = startDateVal;
                }
            } else {
                endDateInput.disabled = true;
                endDateInput.value = '';
            }
        }

        function initializeSavedDisplayTheme() {
            const savedTheme = localStorage.getItem('ot_app_theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        }

        function toggleDisplayTheme() {
            const activeTheme = document.documentElement.getAttribute('data-theme');
            const targetTheme = activeTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', targetTheme);
            localStorage.setItem('ot_app_theme', targetTheme);
        }

        window.onload = function() {
            populateHourOptions();
            initializeSavedDisplayTheme();
            loadLocalStorageCache();
            document.getElementById('yearDisplay').innerText = activeYear;
            document.getElementById('defaultMultiplierSelect').value = meta.defaultMultiplier;
            render();
            initializeGoogleIdentityServiceServices();
        };

        function loadLocalStorageCache() {
            const cacheRecords = localStorage.getItem('ot_records');
            const cacheMeta = localStorage.getItem('ot_meta');
            if (cacheRecords) records = JSON.parse(cacheRecords);
            if (cacheMeta) meta = JSON.parse(cacheMeta);
        }

        function saveStateToLocalStorage() {
            if (isCloudSyncPending) return;
            meta.lastUpdated = Date.now();
            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));
        }

        function updateDefaultMultiplier(val) {
            meta.defaultMultiplier = val;
            saveStateToLocalStorage();
            silentlyExecuteCloudSyncEngineCheck();
        }

        function changeYear(delta) {
            activeYear += delta;
            document.getElementById('yearDisplay').innerText = activeYear;
            render();
        }

        // ==========================================
        // DATE FORMATTER (DD/MM/YYYY HH:mm - 24H STRICT)
        // ==========================================
        function formatDisplayDate(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear();
            const hours = d.getHours().toString().padStart(2, '0');
            const minutes = d.getMinutes().toString().padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        // ==========================================
        // OVERTIME COMPUTATION ENGINE
        // ==========================================
        function calculateOvertime(startDt, endDt, multiplier) {
            let start = new Date(startDt);
            let end = new Date(endDt);

            if (isNaN(start) || isNaN(end) || end <= start) {
                return { hoursWorked: 0, hoursToPay: 0 };
            }

            let totalWorkedMs = end - start;
            let hoursWorked = totalWorkedMs / (1000 * 60 * 60);

            let hoursToPay = 0;
            let current = new Date(start);

            const stepMs = 15 * 60 * 1000;
            const stepHours = 0.25;

            while (current < end) {
                let day = current.getDay(); // 0 = Sunday, 6 = Saturday
                let hour = current.getHours() + (current.getMinutes() / 60);

                if (multiplier === 'ΒΑΡΔΙΑ') {
                    if (day === 0) {
                        hoursToPay += stepHours * 1.8;
                    } else {
                        hoursToPay += stepHours * 1.5;
                    }
                } else if (multiplier === 'ΓΡΑΦΕΙΑΚΟ') {
                    if (day === 0) { // Sunday 00:00 - 24:00 @ 2.0x
                        hoursToPay += stepHours * 2.0;
                    } else if (day === 6) { // Saturday
                        if (hour < 13) {
                            hoursToPay += stepHours * 1.5; // 00:00 - 13:00 @ 1.5x
                        } else {
                            hoursToPay += stepHours * 2.0; // 13:00 - 24:00 @ 2.0x
                        }
                    } else { // Weekdays (Monday to Friday)
                        if (hour >= 17) {
                            hoursToPay += stepHours * 1.5; // 17:00 - 24:00 @ 1.5x
                        }
                    }
                }
                current = new Date(current.getTime() + stepMs);
            }

            return {
                hoursWorked: Math.round(hoursWorked * 100) / 100,
                hoursToPay: Math.round(hoursToPay * 100) / 100
            };
        }

function setDateTimeFields(prefix, isoString) {
    if (!isoString) {
        const now = new Date();
        const year = now.getFullYear();
        const month = (now.getMonth() + 1).toString().padStart(2, '0');
        const day = now.getDate().toString().padStart(2, '0');
        
        document.getElementById(`recStartDate`).value = `${year}-${month}-${day}`;
        document.getElementById(`${prefix}Hour`).value = "08";
        document.getElementById(`${prefix}Min`).value = "00";
        if (prefix === 'recEnd') {
            document.getElementById('recEndDayOffset').value = "0";
        }
        handleHourChange(prefix);
        return;
    }
    const d = new Date(isoString);
    const hourStr = d.getHours().toString().padStart(2, '0');
    const minNum = d.getMinutes();

    let minStr = "00";
    if (minNum >= 38) minStr = "45";
    else if (minNum >= 23) minStr = "30";
    else if (minNum >= 8) minStr = "15";

    if (prefix === 'recStart') {
        const year = d.getFullYear();
        const month = (d.getMonth() + 1).toString().padStart(2, '0');
        const day = d.getDate().toString().padStart(2, '0');
        document.getElementById('recStartDate').value = `${year}-${month}-${day}`;
    }

    document.getElementById(`${prefix}Hour`).value = hourStr;
    document.getElementById(`${prefix}Min`).value = minStr;
    handleHourChange(prefix);
}

function buildISOFromFields(prefix) {
    const dateVal = document.getElementById('recStartDate').value;
    const hourVal = document.getElementById(`${prefix}Hour`).value;
    const minVal = document.getElementById(`${prefix}Min`).value;

    if (!dateVal) return null;

    const parts = dateVal.split('-');
    let baseDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 0, 0, 0);

    if (prefix === 'recEnd') {
        const offset = parseInt(document.getElementById('recEndDayOffset').value) || 0;
        baseDate.setDate(baseDate.getDate() + offset);
    }

    if (hourVal === "24") {
        baseDate.setDate(baseDate.getDate() + 1);
        return baseDate.toISOString();
    }

    baseDate.setHours(parseInt(hourVal), parseInt(minVal), 0);
    return baseDate.toISOString();
}

        // ==========================================
        // FORM & RECORD CONTROLLERS

        function openCreateMode() {
            editingRecordId = null;
            document.getElementById('recName').value = '';
            document.getElementById('recID').value = '';
            
            setDateTimeFields('recStart', null);
            handleStartDateChange();
            setDateTimeFields('recEnd', null);

            document.getElementById('recMultiplier').value = meta.defaultMultiplier;
            document.getElementById('formSubmitBtn').innerText = "Save Overtime Record";
            document.getElementById('recordFormCard').style.display = 'block';
            document.getElementById('formTriggerBtn').style.display = 'none';
        }

function openEditMode(id) {
    const rec = records.find(r => r.id === id);
    if (!rec) return;

    editingRecordId = id;
    document.getElementById('recName').value = rec.name || '';
    document.getElementById('recID').value = rec.idCode || '';
    
    setDateTimeFields('recStart', rec.startTime);
    setDateTimeFields('recEnd', rec.endTime);

    // Calculate whether the end date falls on the next day relative to start date
    if (rec.startTime && rec.endTime) {
        const s = new Date(rec.startTime);
        const e = new Date(rec.endTime);
        const sDay = new Date(s.getFullYear(), s.getMonth(), s.getDate());
        const eDay = new Date(e.getFullYear(), e.getMonth(), e.getDate());
        const diffDays = Math.round((eDay - sDay) / (1000 * 60 * 60 * 24));
        document.getElementById('recEndDayOffset').value = diffDays > 0 ? "1" : "0";
    }
    
    document.getElementById('recMultiplier').value = rec.multiplier;
    document.getElementById('formSubmitBtn').innerText = "Update Record";
    document.getElementById('recordFormCard').style.display = 'block';
    document.getElementById('formTriggerBtn').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

        function closeFormDisplay() {
            document.getElementById('recordFormCard').style.display = 'none';
            document.getElementById('formTriggerBtn').style.display = 'block';
            editingRecordId = null;
        }

async function processFormSubmit() {
    const name = document.getElementById('recName').value.trim();
    const idCode = document.getElementById('recID').value.trim();
    const startDateVal = document.getElementById('recStartDate').value;

    if (!startDateVal) {
        alert("Please select Start Date.");
        return;
    }

    const startVal = buildISOFromFields('recStart');
    const endVal = buildISOFromFields('recEnd');
    const multiplier = document.getElementById('recMultiplier').value;

    const startDateObj = new Date(startVal);
    const endDateObj = new Date(endVal);

    if (endDateObj <= startDateObj) {
        alert("Time Ended must be later than Time Started.");
        return;
    }

    const computed = calculateOvertime(startVal, endVal, multiplier);

    if (editingRecordId) {
        const rec = records.find(r => r.id === editingRecordId);
        if (rec) {
            rec.name = name;
            rec.idCode = idCode;
            rec.startTime = startVal;
            rec.endTime = endVal;
            rec.multiplier = multiplier;
            rec.hoursWorked = computed.hoursWorked;
            rec.hoursToPay = computed.hoursToPay;
        }
    } else {
        const newRecord = {
            id: 'rec_' + Math.random().toString(36).substr(2, 9),
            name,
            idCode,
            startTime: startVal,
            endTime: endVal,
            multiplier,
            hoursWorked: computed.hoursWorked,
            hoursToPay: computed.hoursToPay,
            isPaid: false
        };
        records.push(newRecord);
    }

    saveStateToLocalStorage();
    closeFormDisplay();
    render();
    await silentlyExecuteCloudSyncEngineCheck();
}

        async function togglePaidStatus(id) {
            const rec = records.find(r => r.id === id);

                rec.isPaid = !rec.isPaid;
                saveStateToLocalStorage();
                render();
                await silentlyExecuteCloudSyncEngineCheck();
            }
        }

        async function deleteRecord(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                records = records.filter(r => r.id !== id);
                saveStateToLocalStorage();
                render();
                await silentlyExecuteCloudSyncEngineCheck();
            }
        }

        monthRecords.forEach(r => {
            totalHours += r.hoursToPay;
            if (r.isPaid) {

            } else {
                unpaidHours += r.hoursToPay;
            }

        // ==========================================
        // GOOGLE DRIVE SYNC ARCHITECTURE
        // ==========================================
        // ==========================================
        // GOOGLE DRIVE CLOUD SYNCHRONIZATION
        // Robust OAuth recovery + explicit API errors
        // ==========================================

        let tokenRequestPromise = null;
        let tokenRequestResolve = null;
        let tokenRequestReject = null;
        let tokenRecoveryInProgress = false;

        function setCloudStatus(text) {
            const el = document.getElementById('cloudStatusLabel');
            if (el) el.innerText = text;
        }

        function initializeGoogleIdentityServiceServices() {
            if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
                setCloudStatus('☁ Google Login Unavailable');
                evaluateSignActionBtnVisualState();
                return;
            }

            tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: GOOGLE_CLIENT_ID,
                scope: GOOGLE_DRIVE_SCOPE,
                callback: async (tokenResponse) => {
                    if (tokenResponse.error) {
                        const errorText = tokenResponse.error_description || tokenResponse.error || 'Google authorization failed';
                        console.error('GOOGLE OAUTH ERROR:', tokenResponse);

                        if (tokenRequestReject) {
                            const reject = tokenRequestReject;
                            tokenRequestResolve = null;
                            tokenRequestReject = null;
                            tokenRequestPromise = null;
                            reject(new Error(errorText));
                        }

                        tokenRecoveryInProgress = false;
                        isCloudSyncPending = false;
                        activeAccessToken = null;
                        localStorage.removeItem('gdrive_access_token');
                        evaluateSignActionBtnVisualState();
                        setCloudStatus('☁ Authentication Failed');
                        return;
                    }

                    activeAccessToken = tokenResponse.access_token;
                    localStorage.setItem('gdrive_access_token', activeAccessToken);
                    evaluateSignActionBtnVisualState();
                    tokenRecoveryInProgress = false;

                    if (tokenRequestResolve) {
                        const resolve = tokenRequestResolve;
                        tokenRequestResolve = null;
                        tokenRequestReject = null;
                        tokenRequestPromise = null;
                        resolve(activeAccessToken);
                    } else {
                        // Normal interactive sign-in.
                        isCloudSyncPending = true;
                        await lookupAndSynchronizeCloudBackupStorageState(true);
                    }
                }
            });

            const savedToken = localStorage.getItem('gdrive_access_token');
            if (savedToken) {
                activeAccessToken = savedToken;
                isCloudSyncPending = true;
                evaluateSignActionBtnVisualState();
                silentlyExecuteCloudSyncEngineCheck();
            } else {
                evaluateSignActionBtnVisualState();
            }
        }

        function evaluateSignActionBtnVisualState() {
            const actionBtn = document.getElementById('gdriveMainActionBtn');
            if (!actionBtn) return;

            if (activeAccessToken) {
                actionBtn.innerText = 'Sign Out';
                actionBtn.className = 'btn-cloud-discreet btn-cloud-signout';
                if (!tokenRecoveryInProgress && !isCloudSyncPending) setCloudStatus('☁ Connected');
            } else {
                actionBtn.innerText = 'Sign In';
                actionBtn.className = 'btn-cloud-discreet btn-cloud-signin';
                setCloudStatus('☁ Cloud Offline');
            }
        }

        function requestFreshGoogleAccessToken() {
            if (!tokenClient) {
                return Promise.reject(new Error('Google Identity Services is not initialized.'));
            }

            if (tokenRequestPromise) return tokenRequestPromise;

            tokenRecoveryInProgress = true;
            setCloudStatus('☁ Reconnecting...');

            tokenRequestPromise = new Promise((resolve, reject) => {
                tokenRequestResolve = resolve;
                tokenRequestReject = reject;

                try {
                    // The stored access token may have expired. Request a fresh token.
                    // Consent is used deliberately here so an expired token cannot leave
                    // the application permanently stuck in a failed authentication state.
                    tokenClient.requestAccessToken({ prompt: 'consent' });
                } catch (err) {
                    tokenRecoveryInProgress = false;
                    tokenRequestResolve = null;
                    tokenRequestReject = null;
                    tokenRequestPromise = null;
                    reject(err);
                }
            });

            return tokenRequestPromise;
        }

        async function toggleGoogleDriveConnectionState() {
            if (activeAccessToken) {
                const confirmed = await presentInteractiveSignOutConfirmation();
                if (!confirmed) return;

                activeAccessToken = null;
                gdriveFileId = null;
                isCloudSyncPending = false;
                localStorage.removeItem('gdrive_access_token');
                evaluateSignActionBtnVisualState();
            } else {
                if (!tokenClient) {
                    setCloudStatus('☁ Google Login Unavailable');
                    return;
                }
                try {
                    isCloudSyncPending = true;
                    setCloudStatus('☁ Signing In...');
                    await requestFreshGoogleAccessToken();
                    await lookupAndSynchronizeCloudBackupStorageState(true);
                } catch (err) {
                    console.error('SIGN-IN ERROR:', err);
                    isCloudSyncPending = false;
                    setCloudStatus('☁ Authentication Failed');
                }
            }
        }

        async function silentlyExecuteCloudSyncEngineCheck() {
            if (!activeAccessToken) return;
            await lookupAndSynchronizeCloudBackupStorageState(false);
        }

        async function googleDriveFetch(url, options = {}, allowAuthRecovery = true) {
            if (!activeAccessToken) throw new Error('No Google Drive access token is available.');

            const headers = Object.assign({}, options.headers || {}, {
                'Authorization': `Bearer ${activeAccessToken}`
            });

            let response;
            try {
                response = await fetch(url, Object.assign({}, options, { headers }));
            } catch (networkError) {
                throw new Error(`Network error while contacting Google Drive: ${networkError.message || networkError}`);
            }

            if (response.status === 401 && allowAuthRecovery) {
                console.warn('Google Drive returned 401. Attempting OAuth recovery.');

                try {
                    await requestFreshGoogleAccessToken();
                    return await googleDriveFetch(url, options, false);
                } catch (recoveryError) {
                    activeAccessToken = null;
                    gdriveFileId = null;
                    localStorage.removeItem('gdrive_access_token');
                    evaluateSignActionBtnVisualState();
                    throw new Error(`Google authentication expired and could not be renewed: ${recoveryError.message || recoveryError}`);
                }
            }

            if (!response.ok) {
                let errorBody = null;
                try { errorBody = await response.json(); } catch (_) {}

                const googleMessage = errorBody && errorBody.error
                    ? (errorBody.error.message || errorBody.error.status || JSON.stringify(errorBody.error))
                    : `HTTP ${response.status} ${response.statusText}`;

                const detailedError = new Error(`Google Drive API error (${response.status}): ${googleMessage}`);
                detailedError.status = response.status;
                detailedError.response = errorBody;
                throw detailedError;
            }

            return response;
        }

        function buildDriveFileSearchUrl() {
            const query = encodeURIComponent(`name='${DEDICATED_FILE_NAME}' and trashed=false`);
            return `https://www.googleapis.com/drive/v3/files?q=${query}&spaces=drive&fields=files(id,name,mimeType,modifiedTime,size)`;
        }

        async function fetchCloudDatabase() {
            if (!activeAccessToken) throw new Error('No Google Drive access token is available.');

            if (!gdriveFileId) {
                const response = await googleDriveFetch(buildDriveFileSearchUrl());
                const result = await response.json();

                if (!result.files || result.files.length === 0) return null;
                gdriveFileId = result.files[0].id;
            }

            const response = await googleDriveFetch(
                `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(gdriveFileId)}?alt=media`
            );
            return await response.json();
        }

        async function lookupAndSynchronizeCloudBackupStorageState(promptUser) {
            if (!activeAccessToken) return;

            try {
                setCloudStatus('☁ Checking Cloud...');

                const response = await googleDriveFetch(buildDriveFileSearchUrl());
                const data = await response.json();

                if (data.files && data.files.length > 0) {
                    gdriveFileId = data.files[0].id;
                    await checkTimelineMetricsAgainstCloudTarget(gdriveFileId, promptUser);
                } else {
                    // No cloud file exists. Create the first backup from the local database.
                    await performCloudWriteExecutionSequence(true);
                }
            } catch (err) {
                console.error('OVERTIME CLOUD SYNC FAILURE:', err);
                isCloudSyncPending = false;
                setCloudStatus('☁ Sync Failure');
                showCloudError('Cloud synchronization failed', err);
            } finally {
                isCloudSyncPending = false;
            }
        }

        function showCloudError(title, err) {
            const status = err && err.status ? `\nHTTP Status: ${err.status}` : '';
            const message = err && err.message ? err.message : String(err || 'Unknown error');
            console.error(`${title}: ${message}${status}`);

            // Keep the normal UI clean. The detailed error is available in the console.
            // A small alert is used only for a real sync failure so the user knows why
            // synchronization stopped instead of assuming their local data is damaged.
            if (window.__otLastCloudErrorMessage !== message) {
                window.__otLastCloudErrorMessage = message;
                alert(`${title}:\n\n${message}${status}`);
            }
        }

        async function checkTimelineMetricsAgainstCloudTarget(fileId, promptUser) {
            try {
                const response = await googleDriveFetch(
                    `https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`
                );
                const cloudData = await response.json();

                if (!cloudData || !Array.isArray(cloudData.records) || !cloudData.meta) {
                    throw new Error('The Google Drive backup exists but does not contain a valid Overtime Tracker database.');
                }

                if (!meta.lastUpdated && records.length === 0) {
                    await performCloudPullExtractionSequence(cloudData);
                    return;
                }

                const localStamp = meta.lastUpdated || 0;
                const cloudStamp = cloudData.meta.lastUpdated || 0;
                const localDateStr = localStamp ? new Date(localStamp).toLocaleString() : 'Never';
                const cloudDateStr = cloudStamp ? new Date(cloudStamp).toLocaleString() : 'Never';

                if (localStamp === cloudStamp) {
                    setCloudStatus('☁ Cloud Synced');
                    if (promptUser) {
                        await presentCloudSyncCrossroadsPrompt(
                            'match',
                            'Your local cache database timeline perfectly matches the Cloud asset baseline storage.',
                            localDateStr,
                            cloudDateStr
                        );
                    }
                } else if (cloudStamp > localStamp) {
                    setCloudStatus('☁ Update Available');
                    if (promptUser) {
                        const decision = await presentCloudSyncCrossroadsPrompt(
                            'cloud-newer',
                            'The backup copy on Google Drive is newer than your current local browser instance.',
                            localDateStr,
                            cloudDateStr
                        );
                        if (decision === 'pull') await performCloudPullExtractionSequence(cloudData);
                        else if (decision === 'push') await performCloudWriteExecutionSequence(false);
                        else setCloudStatus('☁ Connected');
                    }
                } else {
                    setCloudStatus('☁ Local Changes Pending');
                    if (promptUser) {
                        const decision = await presentCloudSyncCrossroadsPrompt(
                            'local-newer',
                            'Your current browser state contains changes that are newer than the active cloud backup file.',
                            localDateStr,
                            cloudDateStr
                        );
                        if (decision === 'push') await performCloudWriteExecutionSequence(false);
                        else if (decision === 'pull') await performCloudPullExtractionSequence(cloudData);
                        else setCloudStatus('☁ Connected');
                    }
                }
            } catch (err) {
                console.error('OVERTIME CLOUD TIMELINE ERROR:', err);
                setCloudStatus('☁ Cloud Read Failed');
                showCloudError('Cloud backup could not be read', err);
            }
        }

        function presentCloudSyncCrossroadsPrompt(state, headline, localDateStr, cloudDateStr) {
            return new Promise(resolve => {
                const overlay = document.getElementById('customChoiceOverlay');
                const text = document.getElementById('choiceOverlayMessage');
                const box = document.getElementById('choiceButtonsContainer');
                box.className = 'vertical-buttons';

                if (state === 'match') {
                    text.innerHTML = `<strong>Database Synchronization</strong><br><br>${headline}<br><br>
                        <span style="font-size:12px;color:var(--text-muted);">Local Cache Last Updated:</span><br><strong>${localDateStr}</strong><br><br>
                        <span style="font-size:12px;color:var(--primary);">Cloud Backup Last Updated:</span><br><strong>${cloudDateStr}</strong>`;
                    box.innerHTML = `<button class="btn-choice btn-choice-right btn-choice-full" style="background:var(--success);border-color:var(--success);" id="btnSyncPerfect">Perfect!</button>`;
                    const b = document.getElementById('btnSyncPerfect');
                    const done = () => {
                        b.removeEventListener('click', done);
                        overlay.style.display = 'none';
                        resetContainerToDefaultTemplate(box);
                        resolve('ignore');
                    };
                    b.addEventListener('click', done);
                } else {
                    text.innerHTML = `<strong>Database Synchronization</strong><br><br>${headline}<br><br>
                        <span style="font-size:12px;color:var(--text-muted);">Local Cache Last Updated:</span><br><strong>${localDateStr}</strong><br><br>
                        <span style="font-size:12px;color:var(--primary);">Cloud Backup Last Updated:</span><br><strong>${cloudDateStr}</strong><br><br>What action would you like to take?`;

                    box.innerHTML = state === 'cloud-newer'
                        ? `<button class="btn-choice btn-choice-full" style="background:var(--success);color:white;" id="btnSyncPull">Restore (Download Cloud to Local)</button>
                           <button class="btn-choice btn-choice-danger btn-choice-full" id="btnSyncPush">Backup (Upload Local to Cloud)</button>
                           <button class="btn-choice btn-choice-left btn-choice-full" id="btnSyncIgnore">Do Nothing (Keep Offline Split)</button>`
                        : `<button class="btn-choice btn-choice-right btn-choice-full" id="btnSyncPush">Backup (Upload Local to Cloud)</button>
                           <button class="btn-choice btn-choice-danger btn-choice-full" id="btnSyncPull">Restore (Download Cloud to Local)</button>
                           <button class="btn-choice btn-choice-left btn-choice-full" id="btnSyncIgnore">Do Nothing (Keep Offline Split)</button>`;

                    const p = document.getElementById('btnSyncPush');
                    const q = document.getElementById('btnSyncPull');
                    const i = document.getElementById('btnSyncIgnore');
                    const cleanup = () => {
                        if (p) p.removeEventListener('click', onP);
                        if (q) q.removeEventListener('click', onQ);
                        if (i) i.removeEventListener('click', onI);
                        overlay.style.display = 'none';
                        resetContainerToDefaultTemplate(box);
                    };
                    const onP = () => { cleanup(); resolve('push'); };
                    const onQ = () => { cleanup(); resolve('pull'); };
                    const onI = () => { cleanup(); resolve('ignore'); };
                    if (p) p.addEventListener('click', onP);
                    if (q) q.addEventListener('click', onQ);
                    if (i) i.addEventListener('click', onI);
                }
                overlay.style.display = 'flex';
            });
        }

        function resetContainerToDefaultTemplate(box) {
            box.className = 'choice-buttons-row';
            box.innerHTML = '<button class="btn-choice btn-choice-left" id="choiceLeftActionBtn">Current</button><button class="btn-choice btn-choice-right" id="choiceRightActionBtn">All</button>';
        }

        function presentInteractiveSignOutConfirmation() {
            return new Promise(resolve => {
                const o = document.getElementById('customChoiceOverlay');
                const t = document.getElementById('choiceOverlayMessage');
                const b = document.getElementById('choiceButtonsContainer');
                t.innerHTML = '<strong>Sign Out</strong><br><br>Disconnect this browser from Google Drive?<br><br>Local overtime data will remain intact until browser cache is explicitly cleared.';
                b.className = 'choice-buttons-row';
                b.innerHTML = '<button class="btn-choice btn-choice-left" id="signoutCancel">Cancel</button><button class="btn-choice btn-choice-danger" id="signoutProceed">Sign Out</button>';
                const c = document.getElementById('signoutCancel');
                const p = document.getElementById('signoutProceed');
                const cleanup = () => {
                    c.removeEventListener('click', no);
                    p.removeEventListener('click', yes);
                    o.style.display = 'none';

                const no = () => { cleanup(); resolve(false); };

                c.addEventListener('click', no);

        async function manuallyTriggerCloudBackup() {
            if (!activeAccessToken) {
                setCloudStatus('☁ Access Token Missing');
                alert('Sign in first.');
                return;
            }

            try {
                const cloudDb = await fetchCloudDatabase();
                const localStamp = meta.lastUpdated || 0;
                const cloudStamp = cloudDb && cloudDb.meta ? (cloudDb.meta.lastUpdated || 0) : 0;
                const localDate = localStamp ? new Date(localStamp).toLocaleString() : 'Never (Empty Local Cache)';
                const cloudDate = cloudStamp ? new Date(cloudStamp).toLocaleString() : 'Empty Cloud Storage';

                let state = 'match';
                let headline = '<span style="color:#d4af37;font-weight:bold;">Your offline storage is perfectly matching cloud copies.</span>';

                if (!cloudDb && localStamp === 0) {
                    headline = 'Both local storage and cloud storage are currently uninitialized.';
                    state = 'local-newer';
                } else if (!cloudDb) {
                    state = 'local-newer';
                    headline = 'No file found in the cloud. Local cache is ready to back up.';
                } else if (localStamp > cloudStamp) {
                    state = 'local-newer';
                    headline = '<span style="color:#2563eb;font-weight:bold;">Your Local Cache is newer than the Cloud Backup.</span>';
                } else if (cloudStamp > localStamp) {
                    state = 'cloud-newer';
                    headline = '<span style="color:#16a34a;font-weight:bold;">The Cloud Backup is newer than your Local Cache.</span>';
                }

                const decision = await presentCloudSyncCrossroadsPrompt(state, headline, localDate, cloudDate);
                if (decision === 'push') await performCloudWriteExecutionSequence(false);
                else if (decision === 'pull') await performCloudPullExtractionSequence(cloudDb);
            } catch (err) {
                console.error('MANUAL CLOUD BACKUP ERROR:', err);
                setCloudStatus('☁ Dynamic Sync Error');
                showCloudError('Cloud backup operation failed', err);
            }
        }

        async function manuallyTriggerCloudRestore() {
            if (!activeAccessToken) {
                setCloudStatus('☁ Access Token Missing');
                alert('Sign in first.');
                return;
            }

            try {
                const cloudDb = await fetchCloudDatabase();
                if (!cloudDb) {
                    setCloudStatus('☁ Cloud File Missing');
                    alert('No overtime backup file was found in Google Drive.');
                    return;
                }

                const localStamp = meta.lastUpdated || 0;
                const cloudStamp = cloudDb.meta ? (cloudDb.meta.lastUpdated || 0) : 0;
                const confirmed = await new Promise(resolve => {
                    const o = document.getElementById('customChoiceOverlay');
                    const t = document.getElementById('choiceOverlayMessage');
                    const b = document.getElementById('choiceButtonsContainer');
                    t.innerHTML = `<strong>Restore Overtime Database</strong><br><br>This will replace the current local overtime database with the Google Drive backup.<br><br>
                        <span style="font-size:12px;color:var(--text-muted);">Local Cache Last Updated:</span><br><strong>${localStamp ? new Date(localStamp).toLocaleString() : 'Never (Empty Local Cache)'}</strong><br><br>
                        <span style="font-size:12px;color:var(--primary);">Cloud Backup Last Updated:</span><br><strong>${cloudStamp ? new Date(cloudStamp).toLocaleString() : 'Empty Cloud Storage'}</strong><br><br>Continue with restore?`;
                    b.className = 'choice-buttons-row';
                    b.innerHTML = '<button class="btn-choice btn-choice-left" id="restoreCancel">Cancel</button><button class="btn-choice btn-choice-danger" id="restoreProceed">Restore</button>';
                    const c = document.getElementById('restoreCancel');
                    const p = document.getElementById('restoreProceed');
                    const cleanup = () => {
                        c.removeEventListener('click', no);
                        p.removeEventListener('click', yes);
                        o.style.display = 'none';
                        resetContainerToDefaultTemplate(b);
                    };
                    const no = () => { cleanup(); resolve(false); };
                    const yes = () => { cleanup(); resolve(true); };
                    c.addEventListener('click', no);
                    p.addEventListener('click', yes);
                    o.style.display = 'flex';
                });

                if (confirmed) await performCloudPullExtractionSequence(cloudDb);
                else setCloudStatus('☁ Restore Cancelled');
            } catch (err) {
                console.error('MANUAL CLOUD RESTORE ERROR:', err);
                setCloudStatus('☁ Restore Failed');
                showCloudError('Cloud restore operation failed', err);
            }
        }

        async function performCloudPullExtractionSequence(cloudDb) {
            if (!cloudDb || !Array.isArray(cloudDb.records)) {
                throw new Error('The cloud backup is not a valid Overtime Tracker database.');
            }

            records = cloudDb.records;
            meta = cloudDb.meta || { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now() };

            // IMPORTANT: preserve the cloud timestamp exactly. Do not call saveStateToLocalStorage(),
            // because that would replace the cloud timestamp with a new local timestamp.
            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));
            isCloudSyncPending = false;

            const multiplier = document.getElementById('defaultMultiplierSelect');
            if (multiplier) multiplier.value = meta.defaultMultiplier || 'ΓΡΑΦΕΙΑΚΟ';
            render();
            setCloudStatus('☁ Cloud Synced');
        }

        async function performCloudWriteExecutionSequence(isInitialInstantiation = false) {
            if (!activeAccessToken) throw new Error('No Google Drive access token is available.');

            setCloudStatus(isInitialInstantiation ? '☁ Creating Cloud Backup...' : '☁ Uploading...');
            isCloudSyncPending = false;

            meta.lastUpdated = Date.now();
            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));

            const payload = { records, meta };
            let url = 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
            let method = 'POST';

            if (gdriveFileId) {
                url = `https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(gdriveFileId)}?uploadType=multipart`;
                method = 'PATCH';
            }

            const metadata = { name: DEDICATED_FILE_NAME, mimeType: 'application/json' };
            const boundary = 'overtime_boundary_v35';
            const delimiter = `\r\n--${boundary}\r\n`;
            const closeDelimiter = `\r\n--${boundary}--`;
            const body = delimiter +
                'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
                JSON.stringify(metadata) +
                delimiter +
                'Content-Type: application/json\r\n\r\n' +
                JSON.stringify(payload) +
                closeDelimiter;

            const response = await googleDriveFetch(url, {
                method,
                headers: {
                    'Content-Type': `multipart/related; boundary=${boundary}`
                },
                body
            });

            const responseText = await response.text();
            let responseData = {};
            if (responseText) {
                try { responseData = JSON.parse(responseText); } catch (_) {}
            }

            if (responseData.id) gdriveFileId = responseData.id;
            setCloudStatus('☁ Cloud Synced');
            return responseData;
        }

        // ==========================================
        // OFFLINE BACKUP / RESTORE UTILITIES
        // ==========================================

        function toggleUtilityDrawer() {
            const card = document.getElementById('utilityDrawerCard');
            const arrow = document.getElementById('utilArrow');
            if (!card) return;
            if (card.style.display === 'block') {
                card.style.display = 'none';
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            } else {
                card.style.display = 'block';
                if (arrow) arrow.style.transform = 'rotate(180deg)';
            }
        }

        function triggerResetToScratch() {
            if (!confirm('Are you sure you want to clear your local overtime database completely? All locally stored overtime records and settings will be wiped out.')) return;
            localStorage.removeItem('ot_records');
            localStorage.removeItem('ot_meta');
            records = [];
            meta = { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now() };
            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));
            location.reload();
        }

        function exportToFile() {
            const data = { records, meta };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `overtime_database_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function importFromFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!Array.isArray(parsed.records)) throw new Error('The backup does not contain a valid records array.');

                    records = parsed.records;
                    meta = parsed.meta || { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now() };
                    meta.lastUpdated = Date.now();
                    localStorage.setItem('ot_records', JSON.stringify(records));
                    localStorage.setItem('ot_meta', JSON.stringify(meta));
                    alert('Overtime database recovered successfully.');
                    location.reload();
                } catch (err) {
                    console.error('OFFLINE IMPORT ERROR:', err);
                    alert(`Failure parsing the local overtime backup file.\n\n${err.message || err}`);
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

    </script>
