<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime Tracker</title>
    <script src="config.js"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --primary: #2563eb;
            --danger: #dc2626;
            --success: #16a34a;
            --border: #e5e7eb;
            --utility: #4b5563;
            --edit-color: #0284c7;
            --group-header-bg: #e2e8f0;
            --cloud-bar-bg: #e2e8f0;
            --cloud-bar-text: #475569;
            --cloud-bar-border: #cbd5e1;
            --btn-action-bg: #f9fafb;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #333333;
            --utility: #9ca3af;
            --edit-color: #0ea5e9;
            --group-header-bg: #2d3748;
            --cloud-bar-bg: #1a202c;
            --cloud-bar-text: #a0aec0;
            --cloud-bar-border: #4a5568;
            --btn-action-bg: #2d3748;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; padding-bottom: 60px; min-height: 100vh; transition: background-color 0.2s, color 0.2s; }
        
        .top-cloud-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 16px; 
            flex-wrap: wrap; 
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--cloud-bar-bg);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px dashed var(--cloud-bar-border);
            flex-wrap: wrap;
        }
        .cloud-status-text { font-weight: 600; color: var(--cloud-bar-text); display: flex; align-items: center; gap: 4px; }
        .discreet-actions-grid { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        
        .btn-cloud-discreet { padding: 6px 12px; font-size: 12px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: white; display: inline-flex; align-items: center; gap: 4px; }
        .btn-cloud-signin { background: var(--primary); }
        .btn-cloud-signout { background: var(--utility); }
        .btn-cloud-push { background: #4285f4; }
        .btn-theme-toggle { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); font-size: 12px; font-weight: bold; padding: 6px 12px; border-radius: 6px; cursor: pointer; }

        .default-multiplier-wrapper { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
        .default-multiplier-wrapper select { padding: 4px 8px; font-size: 12px; border-radius: 6px; width: auto; }

        .year-nav-container { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 16px; }
        .btn-nav-arrow { width: 44px; height: 44px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: var(--primary); display: flex; align-items: center; justify-content: center; }
        .year-display { font-size: 22px; font-weight: 800; }

        select, input, button { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; background: var(--card-bg); color: var(--text-main); }
        select:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .btn-trigger-form { background: var(--primary); color: white; font-weight: bold; border: none; margin-bottom: 16px; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; }
        .form-card { background: var(--card-bg); padding: 16px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; display: none; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .form-grid .full-width { grid-column: span 2; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        .datetime-picker-row { display: grid; grid-template-columns: 1.6fr 1fr 1fr; gap: 6px; align-items: center; }
        .datetime-picker-row select, .datetime-picker-row input[type="date"] { padding: 8px 6px; font-size: 13px; }

        .radio-group-row { display: flex; gap: 16px; align-items: center; padding: 4px 0; }
        .radio-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .radio-label input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }

        .btn-primary { background: var(--primary); color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 8px; }
        .btn-cancel-form { background: transparent; color: var(--text-muted); border: none; margin-top: 6px; font-size: 13px; text-decoration: underline; cursor: pointer; width: 100%; }

        .month-card { margin-bottom: 16px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); background: var(--card-bg); }
        .month-header { background: var(--group-header-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; cursor: pointer; flex-wrap: wrap; gap: 8px; }
        .month-title { font-size: 16px; display: flex; align-items: center; gap: 8px; }
        .month-stats { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
        .stat-badge { padding: 4px 8px; border-radius: 6px; background: var(--card-bg); border: 1px solid var(--border); }
        .stat-badge.unpaid { color: var(--danger); border-color: var(--danger); }
        .stat-badge.paid { color: var(--success); border-color: var(--success); }

        .record-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
        .record-item { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 8px; display: flex; flex-direction: column; gap: 8px; border-left: 5px solid var(--danger); }
        .record-item.is-paid { border-left-color: var(--success); opacity: 0.75; }

        .record-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .record-title { font-weight: bold; font-size: 15px; }
        .record-id { font-size: 12px; color: var(--text-muted); font-weight: normal; }
        
        .record-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; font-size: 13px; color: var(--text-muted); margin: 4px 0; }
        .record-details strong { color: var(--text-main); }

        .record-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 8px; margin-top: 4px; }
        .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
        .checkbox-label input { width: 18px; height: 18px; cursor: pointer; }

        .action-btns { display: flex; gap: 6px; }
        .btn-icon { padding: 6px 10px; font-size: 13px; border-radius: 6px; border: 1px solid var(--border); background: var(--btn-action-bg); cursor: pointer; }
        .btn-edit { color: var(--edit-color); }
        .btn-delete { color: var(--danger); }

        .choice-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:2000; padding:24px; align-items:center; justify-content:center; }
        .choice-card { background:var(--card-bg); border-radius:16px; padding:24px; width:100%; max-width:430px; box-shadow:0 20px 25px -5px rgba(0,0,0,.15); border:1px solid var(--border); }
        .choice-message { font-size:16px; font-weight:500; color:var(--text-main); line-height:1.5; margin-bottom:24px; text-align:center; }
        .choice-buttons-row { display:flex; justify-content:space-between; align-items:center; gap:16px; }
        .btn-choice { width:calc(50% - 8px); padding:14px; font-size:15px; font-weight:700; border-radius:10px; cursor:pointer; border:none; text-align:center; }
        .btn-choice-left { background:#e2e8f0; color:#334155; border:1px solid #cbd5e1; }
        .btn-choice-right { background:var(--primary); color:white; }
        .btn-choice-danger { background:var(--danger); color:white; }
        .btn-choice-full { width:100%; margin-bottom:8px; }
        .vertical-buttons { flex-direction:column; gap:4px; width:100%; display:flex; }
        
        .utility-toggle-header { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:28px; color:var(--utility); font-size:14px; font-weight:600; cursor:pointer; user-select:none; padding:8px; }
        .utility-arrow { font-size:11px; transition:transform .2s ease; }
        .utility-card { background:var(--bg-color); padding:16px; border-radius:12px; border:1px dashed var(--utility); margin-top:8px; display:none; }
        .utility-title { font-size:12px; font-weight:bold; color:var(--utility); margin-bottom:8px; letter-spacing:.5px; text-transform:uppercase; }
        .utility-grid { display:grid; grid-template-columns:1fr; gap:8px; }
        .btn-util { background:var(--card-bg); color:var(--text-main); border:1px solid var(--border); font-size:14px; padding:12px; border-radius:8px; width:100%; cursor:pointer; text-align:center; }
        .btn-util-danger { border-color:var(--danger); color:var(--danger); font-weight:600; margin-top:4px; font-size:13px; padding:10px; }
        .file-input-wrapper { position:relative; width:100%; }
        .file-input-wrapper input[type=file] { position:absolute; left:0; top:0; opacity:0; width:100%; height:100%; cursor:pointer; }
        .btn-fake-file { background:var(--card-bg); color:var(--text-main); border:1px solid var(--border); font-size:14px; }

        /* Auth Modals */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: var(--card-bg); padding: 24px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="top-cloud-bar">
    <!-- Group 1: Cloud & Sync Controls -->
    <div class="control-group">
        <div class="cloud-status-text" id="cloudStatusLabel">☁ Cloud Offline</div>
        <div class="discreet-actions-grid">
            <button class="btn-cloud-discreet btn-cloud-signin" id="authMainBtn" onclick="handleAuthActionClick()">Sign In</button>
            <button class="btn-cloud-discreet btn-cloud-signout hidden" id="changePasswordBtn" onclick="openPasswordModal()">Change Password</button>
            <button class="btn-cloud-discreet btn-cloud-push" onclick="executeSmartSync()">🔄 Sync</button>
        </div>
    </div>

    <!-- Group 2: App Preferences & Actions -->
    <div class="control-group">
        <div class="default-multiplier-wrapper">
            <span>Default:</span>
            <select id="defaultMultiplierSelect" onchange="updateDefaultMultiplier(this.value)">
                <option value="ΓΡΑΦΕΙΑΚΟ">ΓΡΑΦΕΙΑΚΟ</option>
                <option value="ΒΑΡΔΙΑ">ΒΑΡΔΙΑ</option>
            </select>
        </div>
        <button class="btn-theme-toggle" onclick="toggleDisplayTheme()">Theme</button>
        <button class="btn-theme-toggle" onclick="promptPdfExportOptions()">📄 Export PDF</button>
    </div>
</div>

    <div class="year-nav-container">
        <button class="btn-nav-arrow" onclick="changeYear(-1)">◀</button>
        <div class="year-display" id="yearDisplay">2026</div>
        <button class="btn-nav-arrow" onclick="changeYear(1)">▶</button>
    </div>

    <button id="formTriggerBtn" class="btn-trigger-form" onclick="openCreateMode()">+ Add New Overtime Record</button>

    <div class="form-card" id="recordFormCard">
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Α/Α (Αύξων Αριθμός Διαταγής)</label>
                <input type="text" id="recID" placeholder="e.g. 12/2026">
            </div>
            <div class="form-group full-width">
                <label>Notes</label>
                <input type="text" id="recName" placeholder="Notes or description">
            </div>

            <!-- Start Time Selector -->
            <div class="form-group full-width">
                <label>Time Started *</label>
                <div class="datetime-picker-row">
                    <input type="date" id="recStartDate">
                    <select id="recStartHour" onchange="handleHourChange('recStart')"></select>
                    <select id="recStartMin">
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>
                </div>
            </div>

            <!-- End Time Selector with Radio Buttons -->
            <div class="form-group full-width">
                <label>Time Ended *</label>
                <div class="radio-group-row">
                    <label class="radio-label">
                        <input type="radio" name="recEndDayOffset" value="0" checked> ΙΔΙΑ ΜΕΡΑ
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="recEndDayOffset" value="1"> ΕΠΟΜΕΝΗ ΜΕΡΑ
                    </label>
                </div>
                <div class="datetime-picker-row" style="grid-template-columns: 1fr 1fr;">
                    <select id="recEndHour" onchange="handleHourChange('recEnd')"></select>
                    <select id="recEndMin">
                        <option value="00">00</option>
                        <option value="15">15</option>
                        <option value="30">30</option>
                        <option value="45">45</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Multiplier *</label>
                <select id="recMultiplier">
                    <option value="ΓΡΑΦΕΙΑΚΟ">ΓΡΑΦΕΙΑΚΟ</option>
                    <option value="ΒΑΡΔΙΑ">ΒΑΡΔΙΑ</option>
                </select>
            </div>
        </div>
        <button class="btn-primary" id="formSubmitBtn" onclick="processFormSubmit()">Save Overtime Record</button>
        <button class="btn-cancel-form" onclick="closeFormDisplay()">Cancel</button>
    </div>

    <div id="monthsContainer"></div>

    <div class="utility-toggle-header" onclick="toggleUtilityDrawer()"><span>Data Options</span><span class="utility-arrow" id="utilArrow">▼</span></div>
    <div class="utility-card" id="utilityDrawerCard">
        
<div class="utility-title">📢 Announcements</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
    <!-- Search Bar & Navigation Header -->
    <div style="display: flex; gap: 6px; align-items: center;">
        <button class="btn-util" id="sharedBackBtn" onclick="navigateParentSharedFolder()" disabled style="width: auto; padding: 6px 12px; font-size: 12px; font-weight: bold;">⬆️ Back</button>
        <span id="sharedCurrentPathDisplay" style="font-size: 11px; font-weight: bold; color: var(--text-muted); text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex: 1;">/ (Root)</span>
        <button class="btn-util" onclick="fetchSharedFileList(currentSharedPath)" style="width: auto; padding: 6px 12px; font-size: 12px; font-weight: bold;">🔄 Refresh</button>
    </div>

    <input type="text" id="sharedFileSearch" placeholder="🔍 Filter current view..." oninput="filterSharedFileList()" style="padding: 6px 10px; font-size: 12px;">

    <!-- Interactive Folder & File Explorer List -->
    <div id="sharedExplorerContainer" style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; max-height: 220px; overflow-y: auto; padding: 4px;">
        <div style="text-align: center; font-size: 12px; color: var(--text-muted); padding: 12px;">Click Refresh or open drawer to load...</div>
    </div>
</div>
        
        <div class="utility-title">Manual Backup (Offline)</div>
        <div class="utility-grid" style="margin-bottom:12px;">
            <button class="btn-util" onclick="exportToFile()">📥 Export Data to File</button>
            <div class="file-input-wrapper"><button class="btn-fake-file btn-util">📤 Import Backup File</button><input type="file" id="importFile" accept=".txt,.json" onchange="importFromFile(event)"></div>
        </div>
        <div class="utility-title" style="border-top:1px dashed var(--border);padding-top:12px;color:var(--danger);">Danger Zone</div>
        <button class="btn-util btn-util-danger" onclick="triggerResetToScratch()">☢ Start From Scratch</button>
    </div>

    <div class="choice-overlay" id="customChoiceOverlay">
        <div class="choice-card">
            <div class="choice-message" id="choiceOverlayMessage">Database Synchronization</div>
            <div class="choice-buttons-row" id="choiceButtonsContainer">
                <button class="btn-choice btn-choice-left" id="choiceLeftActionBtn">Current</button>
                <button class="btn-choice btn-choice-right" id="choiceRightActionBtn">All</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Sign In to Supabase</h3>
            <form onsubmit="executeUserSignIn(event)">
                <div class="form-group" style="margin-bottom: 12px;">
                    <label for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" required placeholder="Enter username">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" required placeholder="Enter password">
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button type="button" class="btn-cancel-form" style="width: auto; margin: 0;" onclick="closeLoginModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="width: auto; margin: 0;">Log In</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="passwordModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 16px;">Change Password</h3>
            <form onsubmit="executePasswordChange(event)">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="newPasswordInput">New Password</label>
                    <input type="password" id="newPasswordInput" required minlength="6" placeholder="At least 6 characters">
                </div>
                <div style="display: flex; gap: 8px; justify-content: flex-end;">
                    <button type="button" class="btn-cancel-form" style="width: auto; margin: 0;" onclick="closePasswordModal()">Cancel</button>
                    <button type="submit" class="btn-primary" style="width: auto; margin: 0;">Update Password</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // SUPABASE & GLOBAL CONFIGURATION
        // -------------------------------------------------------------
        const SUPABASE_URL = 'https://eieqvnvexwsaqaairoam.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_PF9DyXMRIUfO3htpUg0IQQ_Vh2S1mCG';
        const FAKE_EMAIL_DOMAIN = '@326.overtime';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MONTH_NAMES = [
            "Ιανουάριος", "Φεβρουάριος", "Μάρτιος", 
            "Απρίλιος", "Μάιος", "Ιούνιος", 
            "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", 
            "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"
        ];

        // -------------------------------------------------------------
        // SUPABASE SHARED FILES & ANNOUNCEMENTS BROWSER
        // -------------------------------------------------------------
        let availableSharedFiles = [];
        let currentSharedPath = ''; // Root folder

        async function fetchSharedFileList(path = '') {
            currentSharedPath = path;
            updateSharedExplorerUIHeader();

            const container = document.getElementById('sharedExplorerContainer');
            if (!container) return;
            
            container.innerHTML = '<div style="text-align:center; font-size:12px; color:var(--text-muted); padding:12px;">Scanning directory...</div>';
            
            try {
                const { data, error } = await supabaseClient
                    .storage
                    .from('shared')
                    .list(currentSharedPath, { limit: 100, sortBy: { column: 'name', order: 'asc' } });

                if (error) throw error;

                availableSharedFiles = data.filter(item => item.name && item.name !== '.emptyFolderPlaceholder');
                renderSharedExplorer(availableSharedFiles);
            } catch (err) {
                console.error('Failed to fetch shared files:', err);
                container.innerHTML = '<div style="text-align:center; font-size:12px; color:var(--danger); padding:12px;">Unable to load folder contents</div>';
            }
        }

        function renderSharedExplorer(itemList) {
            const container = document.getElementById('sharedExplorerContainer');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (!itemList || itemList.length === 0) {
                container.innerHTML = '<div style="text-align:center; font-size:12px; color:var(--text-muted); padding:12px;">This folder is empty</div>';
                return;
            }
            
            const ul = document.createElement('ul');
            ul.style.listStyle = 'none';
            ul.style.padding = '0';
            ul.style.margin = '0';

            itemList.forEach(item => {
                const isFolder = !item.id && !item.metadata;

                const li = document.createElement('li');
                li.style.display = 'flex';
                li.style.alignItems = 'center';
                li.style.justifyContent = 'space-between';
                li.style.padding = '8px 10px';
                li.style.borderBottom = '1px solid var(--border)';
                li.style.cursor = 'pointer';
                li.style.fontSize = '13px';
                li.style.borderRadius = '6px';

                li.onmouseenter = () => li.style.background = 'var(--cloud-bar-bg)';
                li.onmouseleave = () => li.style.background = 'transparent';

                const fullItemPath = currentSharedPath ? `${currentSharedPath}/${item.name}` : item.name;

                if (isFolder) {
                    li.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px; font-weight:bold; color:var(--primary); overflow:hidden;">
                            <span>📁</span>
                            <span style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${item.name}</span>
                        </div>
                        <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">Folder ➔</span>
                    `;
                    li.onclick = () => fetchSharedFileList(fullItemPath);
                } else {
                    const icon = getFileIcon(item.name);
                    const dateStr = item.created_at ? formatFileDate(item.created_at) : '';

                    li.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px; overflow:hidden;">
                            <span>${icon}</span>
                            <span style="text-overflow:ellipsis; overflow:hidden; white-space:nowrap;">${item.name}</span>
                        </div>
                        <span style="font-size:11px; color:var(--text-muted); margin-left:8px; white-space:nowrap;">${dateStr}</span>
                    `;
                    li.onclick = () => loadSelectedSharedFile(fullItemPath, item.name);
                }

                ul.appendChild(li);
            });

            container.appendChild(ul);
        }

        function filterSharedFileList() {
            const query = document.getElementById('sharedFileSearch').value.toLowerCase();
            const filtered = availableSharedFiles.filter(item => item.name.toLowerCase().includes(query));

        function changeYear(delta) {
            const targetYear = activeYear + delta;
            if (typeof MIN_ALLOWED_YEAR !== 'undefined' && targetYear < MIN_ALLOWED_YEAR) return;
            if (typeof MAX_ALLOWED_YEAR !== 'undefined' && targetYear > MAX_ALLOWED_YEAR) return;

        function formatDisplayDate(isoString) {
            if (!isoString) return '';
            const d = new Date(isoString);
            const day = d.getDate().toString().padStart(2, '0');
            const month = (d.getMonth() + 1).toString().padStart(2, '0');
            const year = d.getFullYear();
            const hours = d.getHours().toString().padStart(2, '0');
            const minutes = d.getMinutes().toString().padStart(2, '0');
            
            return `${day}/${month}/${year} ${hours}:${minutes}`;
        }

        function calculateOvertime(startDt, endDt, multiplier) {
            let start = new Date(startDt);
            let end = new Date(endDt);

            if (isNaN(start) || isNaN(end) || end <= start) {
                return { hoursWorked: 0, hoursToPay: 0 };
            }

            let totalWorkedMs = end - start;
            let hoursWorked = totalWorkedMs / (1000 * 60 * 60);

            let hoursToPay = 0;
            let current = new Date(start);

            const stepMs = 15 * 60 * 1000;
            const stepHours = 0.25;

            while (current < end) {
                let day = current.getDay();
                let hour = current.getHours() + (current.getMinutes() / 60);

                const yyyy = current.getFullYear();
                const mm = String(current.getMonth() + 1).padStart(2, '0');
                const dd = String(current.getDate()).padStart(2, '0');
                const dateStr = `${yyyy}-${mm}-${dd}`;

                const isStandardHoliday = (typeof HOLIDAYS !== 'undefined' && HOLIDAYS.includes(dateStr));
                const isGrafeiakoHoliday = (typeof GRAFEIAKO_ONLY_HOLIDAYS !== 'undefined' && GRAFEIAKO_ONLY_HOLIDAYS.includes(dateStr));

                if (multiplier === 'ΒΑΡΔΙΑ') {
                    const isSundayOrHoliday = (day === 0) || isStandardHoliday;
                    if (isSundayOrHoliday) {
                        hoursToPay += stepHours * 1.8;
                    } else {
                        hoursToPay += stepHours * 1.5;
                    }
                } else if (multiplier === 'ΓΡΑΦΕΙΑΚΟ') {
                    const isSundayOrHoliday = (day === 0) || isStandardHoliday || isGrafeiakoHoliday;
                    
                    if (isSundayOrHoliday) {
                        hoursToPay += stepHours * 2.0;
                    } else if (day === 6) {
                        if (hour < 13) {
                            hoursToPay += stepHours * 1.5;
                        } else {
                            hoursToPay += stepHours * 2.0;
                        }
                    } else {
                        if (hour < 7 || hour >= 17) {
                            hoursToPay += stepHours * 1.5;
                        }
                    }
                }
                current = new Date(current.getTime() + stepMs);
            }

            return {
                hoursWorked: Math.round(hoursWorked * 100) / 100,
                hoursToPay: Math.round(hoursToPay * 100) / 100
            };
        }

        function setDateTimeFields(prefix, isoString) {
            const now = isoString ? new Date(isoString) : new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const day = now.getDate().toString().padStart(2, '0');
            const hourStr = now.getHours().toString().padStart(2, '0');
            
            const minNum = now.getMinutes();
            let minStr = "00";
            if (minNum >= 38) minStr = "45";
            else if (minNum >= 23) minStr = "30";
            else if (minNum >= 8) minStr = "15";

            if (prefix === 'recStart') {
                const dateInput = document.getElementById('recStartDate');
                if (dateInput) dateInput.value = `${year}-${month}-${day}`;
            }

            const hourSelect = document.getElementById(`${prefix}Hour`);
            const minSelect = document.getElementById(`${prefix}Min`);

            if (hourSelect) hourSelect.value = isoString ? hourStr : "08";
            if (minSelect) minSelect.value = isoString ? minStr : "00";
            
            if (prefix === 'recEnd') {
                const radios = document.getElementsByName('recEndDayOffset');
                for (let r of radios) {
                    r.checked = (r.value === "0");
                }
            }

            handleHourChange(prefix);
        }

        function buildISOFromFields(prefix) {
            const dateVal = document.getElementById('recStartDate').value;
            const hourVal = document.getElementById(`${prefix}Hour`).value;
            const minVal = document.getElementById(`${prefix}Min`).value;

            if (!dateVal) return null;

            const parts = dateVal.split('-');
            let baseDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 0, 0, 0);

            if (prefix === 'recEnd') {
                let offset = 0;
                const radios = document.getElementsByName('recEndDayOffset');
                for (let r of radios) {
                    if (r.checked) {
                        offset = parseInt(r.value) || 0;
                        break;
                    }
                }
                baseDate.setDate(baseDate.getDate() + offset);
            }

            if (hourVal === "24") {
                baseDate.setDate(baseDate.getDate() + 1);
                return baseDate.toISOString();
            }

            baseDate.setHours(parseInt(hourVal), parseInt(minVal), 0);
            return baseDate.toISOString();
        }

            document.getElementById('recName').value = '';

        function openEditMode(id) {
            const rec = records.find(r => r.id === id);
            if (!rec) return;

            editingRecordId = id;
            document.getElementById('recName').value = rec.name || '';
            document.getElementById('recID').value = rec.idCode || '';
            
            setDateTimeFields('recStart', rec.startTime);
            setDateTimeFields('recEnd', rec.endTime);

            if (rec.startTime && rec.endTime) {
                const s = new Date(rec.startTime);
                const e = new Date(rec.endTime);
                const sDay = new Date(s.getFullYear(), s.getMonth(), s.getDate());
                const eDay = new Date(e.getFullYear(), e.getMonth(), e.getDate());
                const diffDays = Math.round((eDay - sDay) / (1000 * 60 * 60 * 24));
                
                const targetVal = diffDays > 0 ? "1" : "0";
                const radios = document.getElementsByName('recEndDayOffset');
                for (let r of radios) {
                    r.checked = (r.value === targetVal);
                }
            }
            
            document.getElementById('recMultiplier').value = rec.multiplier;
            document.getElementById('formSubmitBtn').innerText = "Update Record";

        async function processFormSubmit() {
            const name = document.getElementById('recName').value.trim();
            const idCode = document.getElementById('recID').value.trim();
            const startDateVal = document.getElementById('recStartDate').value;

            if (!startDateVal) {
                alert("Please select Start Date.");
                return;
            }

            const startVal = buildISOFromFields('recStart');
            const endVal = buildISOFromFields('recEnd');
            const multiplier = document.getElementById('recMultiplier').value;

            const startDateObj = new Date(startVal);
            const endDateObj = new Date(endVal);

            if (endDateObj <= startDateObj) {
                alert("Time Ended must be later than Time Started.");
                return;
            }

            const computed = calculateOvertime(startVal, endVal, multiplier);

            if (editingRecordId) {
                const rec = records.find(r => r.id === editingRecordId);
                if (rec) {
                    rec.name = name;
                    rec.idCode = idCode;
                    rec.startTime = startVal;
                    rec.endTime = endVal;
                    rec.multiplier = multiplier;
                    rec.hoursWorked = computed.hoursWorked;
                    rec.hoursToPay = computed.hoursToPay;
                }
            } else {
                const newRecord = {
                    id: 'rec_' + Math.random().toString(36).substr(2, 9),
                    name,
                    idCode,
                    startTime: startVal,
                    endTime: endVal,
                    multiplier,
                    hoursWorked: computed.hoursWorked,
                    hoursToPay: computed.hoursToPay,
                    isPaid: false,
                    paidNotes: ''
                };
                records.push(newRecord);
            }

            saveStateToLocalStorage();
            closeFormDisplay();
            render();
            await silentlyExecuteCloudSyncEngineCheck();
        }

        async function deleteRecord(id) {
            if (confirm("Are you sure you want to delete this record?")) {
                records = records.filter(r => r.id !== id);
                saveStateToLocalStorage();
                render();
                await silentlyExecuteCloudSyncEngineCheck();
            }
        }

        function toggleMonthCollapse(monthIdx) {
            collapsedMonths[monthIdx] = !collapsedMonths[monthIdx];
            render();
        }

        function render() {
            const container = document.getElementById('monthsContainer');
            container.innerHTML = '';

            for (let m = 0; m < 12; m++) {
                const monthRecords = records.filter(r => {
                    if (!r.startTime) return false;
                    const d = new Date(r.startTime);
                    return d.getFullYear() === activeYear && d.getMonth() === m;
                }).sort((a, b) => new Date(a.startTime) - new Date(b.startTime));

                let totalHours = 0;
                let paidHours = 0;
                let unpaidHours = 0;

                monthRecords.forEach(r => {
                    totalHours += r.hoursToPay;
                    if (r.isPaid) {
                        paidHours += r.hoursToPay;
                    } else {
                        unpaidHours += r.hoursToPay;
                    }
                });

                const isCollapsed = collapsedMonths[m] !== undefined ? collapsedMonths[m] : (unpaidHours === 0);

                const monthCard = document.createElement('div');
                monthCard.className = "month-card";

                const header = document.createElement('div');
                header.className = "month-header";
                header.onclick = () => toggleMonthCollapse(m);

                header.innerHTML = `
                    <div class="month-title">
                        <span>${isCollapsed ? '▶' : '▼'}</span>
                        <span>${MONTH_NAMES[m]}</span>
                    </div>
                    <div class="month-stats">
                        <span class="stat-badge">Total: ${totalHours.toFixed(2)}h</span>
                        <span class="stat-badge paid">Paid: ${paidHours.toFixed(2)}h</span>
                        <span class="stat-badge unpaid">Pending: ${unpaidHours.toFixed(2)}h</span>
                    </div>
                `;

                monthCard.appendChild(header);

                if (!isCollapsed) {
                    const list = document.createElement('div');
                    list.className = "record-list";

                    if (monthRecords.length === 0) {
                        list.innerHTML = `<div style="text-align:center; font-size:12px; color:var(--text-muted); padding:8px;">No records registered.</div>`;
                    } else {
                        monthRecords.forEach(r => {
                            const startFormatted = formatDisplayDate(r.startTime);
                            const endFormatted = formatDisplayDate(r.endTime);

                            const item = document.createElement('div');
                            item.className = `record-item ${r.isPaid ? 'is-paid' : ''}`;
                            item.innerHTML = `
                                <div class="record-top">
                                    <div class="record-title">${r.idCode ? `Α/Α: ${r.idCode}` : 'No Α/Α'} ${r.name ? `<span class="record-id">(${r.name})</span>` : ''}</div>
                                    <span style="font-size:11px; font-weight:bold; background:var(--group-header-bg); padding:2px 6px; border-radius:4px;">${r.multiplier}</span>
                                </div>
                                <div class="record-details">
                                    <div>Start: <strong>${startFormatted}</strong></div>
                                    <div>End: <strong>${endFormatted}</strong></div>
                                    <div>Worked: <strong>${r.hoursWorked}h</strong></div>
                                    <div>To Pay: <strong>${r.hoursToPay}h</strong></div>
                                </div>
<div class="record-actions">
    <div style="display: flex; align-items: center; gap: 8px; flex: 1; margin-right: 8px;">
        <input type="text" 
               placeholder="Paid Notes" 
               value="${r.paidNotes || ''}" 
               onchange="updatePaidNotes('${r.id}', this.value)" 
               style="max-width: 180px; padding: 4px 8px; font-size: 12px; height: 32px;">
        <label class="checkbox-label">
            <input type="checkbox" ${r.isPaid ? 'checked' : ''} onchange="togglePaidStatus('${r.id}')">
            <span>Paid</span>
        </label>
    </div>
    <div class="action-btns">
        <button class="btn-icon btn-edit" onclick="openEditMode('${r.id}')">📝 Edit</button>
        <button class="btn-icon btn-delete" onclick="deleteRecord('${r.id}')">✕ Delete</button>
    </div>
</div>
                            `;
                            list.appendChild(item);
                        });
                    }
                    monthCard.appendChild(list);
                }
                container.appendChild(monthCard);
            }
        }

        // -------------------------------------------------------------
        // SUPABASE AUTHENTICATION & SYNC MANAGEMENT
        // -------------------------------------------------------------
        function setCloudStatus(text) {
            const el = document.getElementById('cloudStatusLabel');
            if (el) el.innerText = text;
        }

        function initializeSupabaseAuth() {
            supabaseClient.auth.onAuthStateChange(async (event, session) => {
                activeUserSession = session;
                const authBtn = document.getElementById('authMainBtn');
                const pwdBtn = document.getElementById('changePasswordBtn');

                if (session && session.user) {
                    const rawUsername = session.user.email.replace(FAKE_EMAIL_DOMAIN, '');
                    if (authBtn) {
                        authBtn.innerText = `Sign Out (${rawUsername})`;
                        authBtn.className = 'btn-cloud-discreet btn-cloud-signout';
                    }
                    if (pwdBtn) pwdBtn.classList.remove('hidden');
                    setCloudStatus('☁ Connected');
                    await lookupAndSynchronizeCloudBackupStorageState(true);
                } else {
                    if (authBtn) {
                        authBtn.innerText = 'Sign In';
                        authBtn.className = 'btn-cloud-discreet btn-cloud-signin';
                    }
                    if (pwdBtn) pwdBtn.classList.add('hidden');
                    setCloudStatus('☁ Cloud Offline');
                }
            });
        }

        async function handleAuthActionClick() {
            if (activeUserSession) {
                const confirmed = await presentInteractiveSignOutConfirmation();
                if (!confirmed) return;
                await supabaseClient.auth.signOut();
                clearLocalUserDataOnSignOut();
            } else {
                openLoginModal();
            }
        }

        function clearLocalUserDataOnSignOut() {
            localStorage.removeItem('ot_records');
            localStorage.removeItem('ot_meta');
            records = [];
            meta = { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now(), theme: localStorage.getItem('ot_app_theme') || 'light' };
            const multiplierSelect = document.getElementById('defaultMultiplierSelect');
            if (multiplierSelect) multiplierSelect.value = meta.defaultMultiplier;
            render();
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginPassword').value = '';
        }

        function openPasswordModal() {
            document.getElementById('passwordModal').classList.remove('hidden');
        }

        function closePasswordModal() {
            document.getElementById('passwordModal').classList.add('hidden');
            document.getElementById('newPasswordInput').value = '';
        }

        async function executeUserSignIn(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;

            const syntheticEmail = `${username}${FAKE_EMAIL_DOMAIN}`;
            closeLoginModal();
            setCloudStatus('☁ Signing In...');
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: syntheticEmail,
                password: password
            });

            if (error) {
                alert('Authentication failed: ' + error.message);
                setCloudStatus('☁ Authentication Failed');
                openLoginModal();
            } else {
                closeLoginModal();
            }
        }

        async function executePasswordChange(e) {
            e.preventDefault();
            const newPassword = document.getElementById('newPasswordInput').value;

            const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

            if (error) {
                alert('Password update failed: ' + error.message);
            } else {
                alert('Password updated successfully!');
                closePasswordModal();
            }
        }

        async function fetchCloudDatabase() {
            if (!activeUserSession || !activeUserSession.user) return null;

            const { data, error } = await supabaseClient
                .from('expenses')
                .select('data')
                .eq('user_id', activeUserSession.user.id)
                .maybeSingle();

            if (error) {
                console.error('Fetch error:', error);
                throw error;
            }
            return data ? data.data : null;
        }

        async function silentlyExecuteCloudSyncEngineCheck() {
            if (!activeUserSession) return;
            await lookupAndSynchronizeCloudBackupStorageState(false);
        }

        async function lookupAndSynchronizeCloudBackupStorageState(promptUser) {
            if (!activeUserSession) return;

            try {
                setCloudStatus('☁ Checking Cloud...');
                const cloudDb = await fetchCloudDatabase();

                if (cloudDb && Array.isArray(cloudDb.records)) {
                    const isLocalEmpty = records.length === 0;

                    if (isLocalEmpty) {
                        await performCloudPullExtractionSequence(cloudDb, true);
                    } else {
                        await checkTimelineMetricsAgainstCloudTarget(cloudDb, promptUser);
                    }
                } else {
                    await initializeBlankUserCloudDatabase();
                }
            } catch (err) {
                console.error('Sync check failed:', err);
                setCloudStatus('☁ Sync Failure');
            }
        }

        async function initializeBlankUserCloudDatabase() {
            if (!activeUserSession || !activeUserSession.user) return;

            setCloudStatus('☁ Initializing Account...');

            records = [];
            meta = {
                defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ',
                lastUpdated: Date.now(),
                theme: localStorage.getItem('ot_app_theme') || 'light'
            };

            const payload = { records, meta };

            const { error } = await supabaseClient
                .from('expenses')
                .upsert({
                    user_id: activeUserSession.user.id,
                    data: payload,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

            if (error) {
                console.error('Initial database creation failed:', error.message);
                setCloudStatus('☁ Init Failure');
            } else {
                saveStateToLocalStorage();
                const multiplierSelect = document.getElementById('defaultMultiplierSelect');
                if (multiplierSelect) multiplierSelect.value = meta.defaultMultiplier;
                render();
                setCloudStatus('☁ Cloud Synced');
            }
        }

        async function checkTimelineMetricsAgainstCloudTarget(cloudData, promptUser) {
            if (!cloudData || !Array.isArray(cloudData.records)) return;

            if (!meta.lastUpdated && records.length === 0) {
                await performCloudPullExtractionSequence(cloudData, true);
                return;
            }

            const localStamp = meta.lastUpdated || 0;
            const cloudStamp = cloudData.meta ? cloudData.meta.lastUpdated || 0 : 0;
            const localDateStr = localStamp ? new Date(localStamp).toLocaleString() : 'Never';
            const cloudDateStr = cloudStamp ? new Date(cloudStamp).toLocaleString() : 'Never';

            if (localStamp === cloudStamp) {
                setCloudStatus('☁ Cloud Synced');
            } else if (cloudStamp > localStamp) {
                setCloudStatus('☁ Update Available');
                if (promptUser) {
                    const decision = await presentCloudSyncCrossroadsPrompt('cloud-newer', 'The backup copy on Supabase is newer than your current local browser instance.', localDateStr, cloudDateStr);
                    if (decision === 'pull') await performCloudPullExtractionSequence(cloudData);
                    else if (decision === 'push') await performCloudWriteExecutionSequence();
                }
            } else {
                setCloudStatus('☁ Local Changes Pending');
                if (promptUser) {
                    const decision = await presentCloudSyncCrossroadsPrompt('local-newer', 'Your current browser state contains changes that are newer than the active cloud backup file.', localDateStr, cloudDateStr);
                    if (decision === 'push') await performCloudWriteExecutionSequence();
                    else if (decision === 'pull') await performCloudPullExtractionSequence(cloudData);
                }
            }
        }

        function presentCloudSyncCrossroadsPrompt(state, headline, localDateStr, cloudDateStr) {
            return new Promise(resolve => {
                const overlay = document.getElementById('customChoiceOverlay');
                const text = document.getElementById('choiceOverlayMessage');
                const box = document.getElementById('choiceButtonsContainer');
                box.className = 'vertical-buttons';

                if (state === 'match') {
                    text.innerHTML = `<strong>Database Synchronization</strong><br><br>${headline}<br><br><span style="font-size:12px;color:var(--text-muted);">Local Cache Last Updated:</span><br><strong>${localDateStr}</strong><br><br><span style="font-size:12px;color:var(--primary);">Cloud Backup Last Updated:</span><br><strong>${cloudDateStr}</strong>`;
                    box.innerHTML = `<button class="btn-choice btn-choice-right btn-choice-full" style="background:var(--success);border-color:var(--success);" id="btnSyncPerfect">Perfect!</button>`;
                    const b = document.getElementById('btnSyncPerfect');
                    const done = () => {
                        b.removeEventListener('click', done);
                        overlay.style.display = 'none';
                        resetContainerToDefaultTemplate(box);
                        resolve('ignore');
                    };
                    b.addEventListener('click', done);
                } else {
                    text.innerHTML = `<strong>Database Synchronization</strong><br><br>${headline}<br><br><span style="font-size:12px;color:var(--text-muted);">Local Cache Last Updated:</span><br><strong>${localDateStr}</strong><br><br><span style="font-size:12px;color:var(--primary);">Cloud Backup Last Updated:</span><br><strong>${cloudDateStr}</strong><br><br>What action would you like to take?`;

                    box.innerHTML = state === 'cloud-newer'
                        ? `<button class="btn-choice btn-choice-full" style="background:var(--success);color:white;" id="btnSyncPull">Restore (Download Cloud to Local)</button><button class="btn-choice btn-choice-danger btn-choice-full" id="btnSyncPush">Backup (Upload Local to Cloud)</button><button class="btn-choice btn-choice-left btn-choice-full" id="btnSyncIgnore">Do Nothing</button>`
                        : `<button class="btn-choice btn-choice-right btn-choice-full" id="btnSyncPush">Backup (Upload Local to Cloud)</button><button class="btn-choice btn-choice-danger btn-choice-full" id="btnSyncPull">Restore (Download Cloud to Local)</button><button class="btn-choice btn-choice-left btn-choice-full" id="btnSyncIgnore">Do Nothing</button>`;

                    const p = document.getElementById('btnSyncPush');
                    const q = document.getElementById('btnSyncPull');
                    const i = document.getElementById('btnSyncIgnore');
                    const cleanup = () => {
                        if (p) p.removeEventListener('click', onP);
                        if (q) q.removeEventListener('click', onQ);
                        if (i) i.removeEventListener('click', onI);
                        overlay.style.display = 'none';
                        resetContainerToDefaultTemplate(box);
                    };
                    const onP = () => { cleanup(); resolve('push'); };
                    const onQ = () => { cleanup(); resolve('pull'); };
                    const onI = () => { cleanup(); resolve('ignore'); };
                    if (p) p.addEventListener('click', onP);
                    if (q) q.addEventListener('click', onQ);
                    if (i) i.addEventListener('click', onI);
                }
                overlay.style.display = 'flex';
            });
        }

        function presentOverwriteWarningPrompt(targetType) {
            return new Promise(resolve => {
                const o = document.getElementById('customChoiceOverlay');
                const t = document.getElementById('choiceOverlayMessage');
                const b = document.getElementById('choiceButtonsContainer');
                
                const warningMsg = targetType === 'cloud'
                    ? 'Are you sure you want to overwrite <strong>cloud</strong> data with current <strong>local</strong> data? There is no way back.'
                    : 'Are you sure you want to overwrite <strong>local</strong> data with current <strong>cloud</strong> data? There is no way back.';

                t.innerHTML = `<strong>⚠️ Warning: Destructive Action</strong><br><br>${warningMsg}`;
                b.className = 'choice-buttons-row';
                b.innerHTML = '<button class="btn-choice btn-choice-left" id="warnNo">No (Abort)</button><button class="btn-choice btn-choice-danger" id="warnYes">Yes (Overwrite)</button>';
                
                const btnNo = document.getElementById('warnNo');
                const btnYes = document.getElementById('warnYes');

                const cleanup = () => {
                    btnNo.removeEventListener('click', onNo);
                    btnYes.removeEventListener('click', onYes);
                    o.style.display = 'none';
                    resetContainerToDefaultTemplate(b);
                };

                const onNo = () => { cleanup(); resolve(false); };
                const onYes = () => { cleanup(); resolve(true); };

                btnNo.addEventListener('click', onNo);
                btnYes.addEventListener('click', onYes);
                o.style.display = 'flex';
            });
        }

        function resetContainerToDefaultTemplate(box) {
            box.className = 'choice-buttons-row';
            box.innerHTML = '<button class="btn-choice btn-choice-left" id="choiceLeftActionBtn">Current</button><button class="btn-choice btn-choice-right" id="choiceRightActionBtn">All</button>';
        }

        function presentInteractiveSignOutConfirmation() {
            return new Promise(resolve => {
                const o = document.getElementById('customChoiceOverlay');
                const t = document.getElementById('choiceOverlayMessage');
                const b = document.getElementById('choiceButtonsContainer');
                t.innerHTML = '<strong>Sign Out</strong><br><br>Are you sure you want to sign out?';
                b.className = 'choice-buttons-row';
                b.innerHTML = '<button class="btn-choice btn-choice-left" id="signoutCancel">Cancel</button><button class="btn-choice btn-choice-danger" id="signoutProceed">Sign Out</button>';
                const c = document.getElementById('signoutCancel');
                const p = document.getElementById('signoutProceed');
                const cleanup = () => {
                    c.removeEventListener('click', no);
                    p.removeEventListener('click', yes);
                    o.style.display = 'none';
                    resetContainerToDefaultTemplate(b);
                };
                const no = () => { cleanup(); resolve(false); };
                const yes = () => { cleanup(); resolve(true); };
                c.addEventListener('click', no);
                p.addEventListener('click', yes);
                o.style.display = 'flex';
            });
        }

        async function executeSmartSync() {
            if (!activeUserSession) { 
                alert('Sign in first.'); 
                return; 
            }
            
            try {
                setCloudStatus('☁ Syncing...');
                const cloudDb = await fetchCloudDatabase();

                if (!cloudDb || !Array.isArray(cloudDb.records)) {
                    await performCloudWriteExecutionSequence();
                    return;
                }

                if (records.length === 0 && cloudDb.records.length > 0) {
                    await performCloudPullExtractionSequence(cloudDb, true);
                    return;
                }

                await checkTimelineMetricsAgainstCloudTarget(cloudDb, true);
            } catch (err) {
                console.error('Sync Error:', err);
                setCloudStatus('☁ Sync Failure');
            }
        }

        async function performCloudPullExtractionSequence(cloudDb, skipWarning = false) {
            if (!cloudDb || !Array.isArray(cloudDb.records)) return;

            if (!skipWarning) {
                const confirmed = await presentOverwriteWarningPrompt('local');
                if (!confirmed) {
                    setCloudStatus('☁ Sync Aborted');
                    return;
                }
            }

            records = cloudDb.records;
            meta = cloudDb.meta || { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now(), theme: 'light' };

            if (meta.theme) {
                document.documentElement.setAttribute('data-theme', meta.theme);
                localStorage.setItem('ot_app_theme', meta.theme);
            }

            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));

            const multiplier = document.getElementById('defaultMultiplierSelect');
            if (multiplier) multiplier.value = meta.defaultMultiplier || 'ΓΡΑΦΕΙΑΚΟ';
            render();
            setCloudStatus('☁ Cloud Synced');
        }

        async function performCloudWriteExecutionSequence(skipWarning = false) {
            if (!activeUserSession || !activeUserSession.user) return;

            if (!skipWarning) {
                const confirmed = await presentOverwriteWarningPrompt('cloud');
                if (!confirmed) {
                    setCloudStatus('☁ Sync Aborted');
                    return;
                }
            }

            setCloudStatus('☁ Uploading...');

            meta.lastUpdated = Date.now();
            meta.theme = localStorage.getItem('ot_app_theme') || meta.theme || 'light';
            localStorage.setItem('ot_records', JSON.stringify(records));
            localStorage.setItem('ot_meta', JSON.stringify(meta));

            const payload = { records, meta };

            const { error } = await supabaseClient
                .from('expenses')
                .upsert({
                    user_id: activeUserSession.user.id,
                    data: payload,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'user_id' });

            if (error) {
                console.error('Supabase Sync Error:', error.message);
                setCloudStatus('☁ Sync Failure');
            } else {
                setCloudStatus('☁ Cloud Synced');
            }
        }

        function toggleUtilityDrawer() {
            const card = document.getElementById('utilityDrawerCard');
            const arrow = document.getElementById('utilArrow');
            if (!card) return;
            if (card.style.display === 'block') {
                card.style.display = 'none';
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            } else {
                card.style.display = 'block';
                if (arrow) arrow.style.transform = 'rotate(180deg)';
                fetchSharedFileList();
            }
        }

        async function triggerResetToScratch() {
            if (!confirm('Clear all data? This will wipe your local database and, if signed in, your cloud backup. This cannot be undone.')) return;
            
            records = [];
            meta = { 
                defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', 
                lastUpdated: Date.now(), 
                theme: localStorage.getItem('ot_app_theme') || 'light' 
            };
            
            if (activeUserSession) {
                setCloudStatus('☁ Wiping Cloud Database...');
                await performCloudWriteExecutionSequence(true);
            } else {
                localStorage.setItem('ot_records', JSON.stringify(records));
                localStorage.setItem('ot_meta', JSON.stringify(meta));
            }
            
            location.reload();
        }

        function exportToFile() {
            const data = { records, meta };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `overtime_backup_${new Date().toISOString().slice(0, 10)}.json`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function importFromFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (!Array.isArray(parsed.records)) throw new Error('Invalid format');

                    records = parsed.records;
                    meta = parsed.meta || { defaultMultiplier: 'ΓΡΑΦΕΙΑΚΟ', lastUpdated: Date.now(), theme: 'light' };
                    meta.lastUpdated = Date.now();

                    if (meta.theme) {
                        document.documentElement.setAttribute('data-theme', meta.theme);
                        localStorage.setItem('ot_app_theme', meta.theme);
                    }

                    localStorage.setItem('ot_records', JSON.stringify(records));
                    localStorage.setItem('ot_meta', JSON.stringify(meta));
                    location.reload();
                } catch (err) {
                    alert('Failure importing file.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }
    </script>
